<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDSYS - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="card-header">
                <h2>Admin Login</h2>
            </div>

            {% if error %}
            <div style="margin: 0 0 16px; padding: 10px 12px; background: #fee2e2; color:#991b1b; border-radius: 10px;">
                {{ error }}
            </div>
            {% endif %}

            <form action="/admin/login" method="post" class="card-body">
                <div class="field">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="field">
                    <label for="password">Admin Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>

            <div class="register-text">
                <a href="{{ url_for('login') }}">User Login</a>
            </div>
        </div>
    </div>

</body>
</html>
